version: "3.9"

# ─────────────────────────────────────────────
#  AI Avatar POC — Docker Compose
#  Services:
#    avatar-engine   GPU  — MuseTalk + MediaPipe expression layer
#    webrtc-bridge        — aiortc, injects avatar frames into WebRTC
#    livekit-agent        — LiveKit Agents pipeline (STT→LLM→TTS)
#    api-gateway          — REST + WS entrypoint for frontend
#    frontend             — React app (Vite)
#    redis                — pub/sub between services
# ─────────────────────────────────────────────

networks:
  avatar-net:
    driver: bridge

volumes:
  models:
    driver: local

services:

  # ── Redis (pub/sub backbone) ──────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [avatar-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Avatar Engine (GPU) ───────────────────────────────────
  avatar-engine:
    build:
      context: ./services/avatar-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [avatar-net]
    volumes:
      - models:/app/models
      - ./services/avatar-engine:/app/src:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_DIR=/app/models
      - DEVICE=${AVATAR_DEVICE:-cuda}
      - FPS_TARGET=${FPS_TARGET:-25}
      - FACE_SIZE=${FACE_SIZE:-256}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy

  # ── WebRTC Bridge ─────────────────────────────────────────
  webrtc-bridge:
    build:
      context: ./services/webrtc-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [avatar-net]
    ports:
      - "8002:8002"
      - "50000-50020:50000-50020/udp"   # ICE / RTP media ports
    environment:
      - REDIS_URL=redis://redis:6379
      - AVATAR_ENGINE_URL=http://avatar-engine:8001
      - STUN_SERVER=${STUN_SERVER:-stun:stun.l.google.com:19302}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      avatar-engine:
        condition: service_healthy

  # ── LiveKit Agent ─────────────────────────────────────────
  livekit-agent:
    build:
      context: ./services/livekit-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [avatar-net]
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - AGENT_SYSTEM_PROMPT=${AGENT_SYSTEM_PROMPT:-You are a helpful AI assistant. Be concise and conversational.}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - TTS_PROVIDER=${TTS_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy

  # ── API Gateway ───────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [avatar-net]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - WEBRTC_BRIDGE_URL=http://webrtc-bridge:8002
      - AVATAR_ENGINE_URL=http://avatar-engine:8001
      - UPLOAD_DIR=/tmp/uploads
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy

  # ── Frontend (React/Vite) ─────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
        - VITE_WEBRTC_URL=${VITE_WEBRTC_URL:-http://localhost:8002}
    restart: unless-stopped
    networks: [avatar-net]
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
